version: '3.8'

services:
  stock-agent:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_PORT=5000
      - DEBUG_MODE=False
    volumes:
      - ./charts:/app/charts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# To run: docker-compose up -d
# To stop: docker-compose down
# Logs: docker-compose logs -f stock-agent
